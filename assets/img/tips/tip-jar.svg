<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 188" width="200" height="188" role="img" aria-labelledby="title">
  <title id="title">Cartoon tip jar full of Zcash and X coins</title>
  <defs>
    <radialGradient id="zecFace" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffe792"/>
      <stop offset="55%" stop-color="#f0c14b"/>
      <stop offset="100%" stop-color="#c4921c"/>
    </radialGradient>
    <radialGradient id="zecEdge" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e0a82e"/>
      <stop offset="100%" stop-color="#8a6410"/>
    </radialGradient>
    <radialGradient id="xFace" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="xEdge" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <linearGradient id="lidSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a06a"/>
      <stop offset="35%" stop-color="#d4843c"/>
      <stop offset="70%" stop-color="#a85e22"/>
      <stop offset="100%" stop-color="#7a4218"/>
    </linearGradient>
    <radialGradient id="lidTop" cx="42%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f3c08a"/>
      <stop offset="45%" stop-color="#e09a4a"/>
      <stop offset="100%" stop-color="#b06828"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="18%" stop-color="#c5d4bc"/>
      <stop offset="55%" stop-color="#9aaf90"/>
      <stop offset="100%" stop-color="#d2dec8"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#edf3e6" stop-opacity="0.30"/>
      <stop offset="28%" stop-color="#edf3e6" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#c5d4bc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9aaf90" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="100%" stop-color="#edd9a8"/>
    </linearGradient>
    <!-- Inner cavity: inset from the glass wall so coins sit inside the jar -->
    <clipPath id="jarClip">
      <path d="M44,53
        C31,58 28.5,72 27.8,94
        C27.2,122 30,149 43,162
        C56,175 76,176.5 100,176.5
        C124,176.5 144,175 157,162
        C170,149 172.8,122 172.2,94
        C171.5,72 169,58 156,53
        Z"/>
    </clipPath>
    <!-- Official Zcash Z geometry (zcash/logos 2018 icon), scaled to the coin. Single closed path: straight bars, short vertical stubs. -->
    <g id="zMark">
      <path fill="#1a1406" d="M-9.054,7.894 L-9.054,11.768 L-2.128,11.768 L-2.128,16.014 L2.128,16.014 L2.128,11.768 L9.054,11.768 L9.054,6.644 L-1.689,6.644 L9.054,-7.928 L9.054,-11.802 L2.128,-11.802 L2.128,-16.036 L-2.128,-16.036 L-2.128,-11.802 L-9.054,-11.802 L-9.054,-6.667 L1.689,-6.667 Z"/>
    </g>
    <g id="xMark">
      <path fill="#fff" d="M-10.8,-11.6 L-6.6,-11.6 L0,-2.55 L6.6,-11.6 L10.8,-11.6 L3.85,0 L10.8,11.6 L6.6,11.6 L0,2.55 L-6.6,11.6 L-10.8,11.6 L-3.85,0 Z"/>
    </g>
    <g id="coinZec">
      <circle cx="1.5" cy="2.2" r="20.3" fill="url(#zecEdge)"/>
      <circle r="20" fill="url(#zecFace)"/>
      <circle r="20" fill="none" stroke="#8a6410" stroke-width="1.15"/>
      <circle r="16.3" fill="none" stroke="#d4a017" stroke-width="0.95"/>
      <path d="M-11.5,-9.5 A13.5 13.5 0 0 1 3.5,-13.2" fill="none" stroke="#fff6c8" stroke-width="2.3" stroke-linecap="round" opacity="0.55"/>
      <use href="#zMark"/>
    </g>
    <g id="coinX">
      <circle cx="1.5" cy="2.2" r="20.3" fill="url(#xEdge)"/>
      <circle r="20" fill="url(#xFace)"/>
      <circle r="20" fill="none" stroke="#0a0a0a" stroke-width="1.15"/>
      <circle r="16.3" fill="none" stroke="#7a7a7a" stroke-width="0.9"/>
      <use href="#xMark"/>
      <path d="M-11.5,-9.5 A13.5 13.5 0 0 1 3.5,-13.2" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" opacity="0.30"/>
    </g>
    <g id="coinEdgeGold">
      <ellipse cx="0.8" cy="2.3" rx="20.3" ry="6.6" fill="#8a6410"/>
      <path fill="#c4921c" d="M-20.2,0 A20.2 6.2 0 0 0 20.2,0 L21,2.5 A21 6.5 0 0 1 -21,2.5 Z"/>
      <ellipse rx="20.2" ry="6.2" fill="url(#zecFace)" stroke="#8a6410" stroke-width="0.8"/>
      <ellipse rx="15" ry="4.2" fill="none" stroke="#d4a017" stroke-width="0.6" opacity="0.7"/>
    </g>
    <g id="coinEdgeX">
      <ellipse cx="0.8" cy="2.3" rx="20.3" ry="6.6" fill="#0a0a0a"/>
      <path fill="#2a2a2a" d="M-20.2,0 A20.2 6.2 0 0 0 20.2,0 L21,2.5 A21 6.5 0 0 1 -21,2.5 Z"/>
      <ellipse rx="20.2" ry="6.2" fill="url(#xFace)" stroke="#0a0a0a" stroke-width="0.8"/>
      <ellipse rx="15" ry="4.2" fill="none" stroke="#6a6a6a" stroke-width="0.6" opacity="0.7"/>
    </g>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="178" rx="70" ry="8.5" fill="#000" opacity="0.30"/>

  <!-- Glass wall (the fat rim you can see around the coins) -->
  <path d="M40.5,49
    C26,54 23,70 22.5,94
    C22,124 25,152 39,166.5
    C53,181 74,183 100,183
    C126,183 147,181 161,166.5
    C175,152 178,124 177.5,94
    C177,70 174,54 159.5,49
    Z" fill="url(#glassWall)" stroke="#243022" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Inner floor, slightly darker, seen through the glass -->
  <path d="M44,53
    C31,58 28.5,72 27.8,94
    C27.2,122 30,149 43,162
    C56,175 76,176.5 100,176.5
    C124,176.5 144,175 157,162
    C170,149 172.8,122 172.2,94
    C171.5,72 169,58 156,53
    Z" fill="#2a3528" opacity="0.22"/>

  <!-- Coins in the jar. Most are kept nearly round so the Z and X stay legible. -->
  <g clip-path="url(#jarClip)">
    <!-- back / upper row, just under the lid -->
    <use href="#coinX"   transform="translate(60,80) rotate(-20) scale(0.92)"/>
    <use href="#coinZec" transform="translate(100,70) rotate(10) scale(0.98)"/>
    <use href="#coinX"   transform="translate(140,78) rotate(18) scale(0.90)"/>
    <use href="#coinZec" transform="translate(166,98) rotate(-16) scale(0.86)"/>

    <!-- middle pile -->
    <use href="#coinEdgeGold" transform="translate(80,97) rotate(-16) scale(0.95)"/>
    <use href="#coinZec" transform="translate(48,110) rotate(-14) scale(1.04)"/>
    <use href="#coinX"   transform="translate(88,105) rotate(12) scale(0.98)"/>
    <use href="#coinZec" transform="translate(128,100) rotate(-18) scale(1.02)"/>
    <use href="#coinX"   transform="translate(162,116) rotate(14) scale(0.94)"/>
    <use href="#coinEdgeX" transform="translate(110,118) rotate(10) scale(0.92)"/>

    <!-- front / lower, peeking around the label -->
    <use href="#coinZec" transform="translate(54,142) rotate(8) scale(1.08)"/>
    <use href="#coinX"   transform="translate(94,150) rotate(-10) scale(1.02)"/>
    <use href="#coinZec" transform="translate(134,148) rotate(16) scale(1.06)"/>
    <use href="#coinX"   transform="translate(166,140) rotate(-12) scale(1.00)"/>
    <use href="#coinZec" transform="translate(116,128) rotate(-6) scale(0.90)"/>
  </g>

  <!-- Glass tint and highlights over the coins -->
  <path d="M44,53
    C31,58 28.5,72 27.8,94
    C27.2,122 30,149 43,162
    C56,175 76,176.5 100,176.5
    C124,176.5 144,175 157,162
    C170,149 172.8,122 172.2,94
    C171.5,72 169,58 156,53
    Z" fill="url(#glassFill)"/>

  <g clip-path="url(#jarClip)">
    <path d="M40,56 C32,74 31,102 34,132 C36,152 42,164 50,170 C43,148 41,108 45,80 C47,66 45,58 40,56 Z" fill="#edf3e6" opacity="0.42"/>
    <path d="M162,62 C169,82 171,112 167,142 C165,158 158,168 154,170 C161,148 163,110 159,80 C157,68 159,64 162,62 Z" fill="#edf3e6" opacity="0.12"/>
    <ellipse cx="100" cy="54" rx="54" ry="7" fill="#000" opacity="0.16"/>
  </g>

  <!-- Inner lip highlight at the mouth -->
  <path d="M44,53 C40,54 38,55 37.2,57 H162.8 C162,55 160,54 156,53 Z" fill="#edf3e6" opacity="0.40"/>

  <!-- Paper TIPS label -->
  <g transform="translate(100,143) rotate(-5)">
    <rect x="-44" y="-15.5" width="88" height="33" rx="2.2" fill="#000" opacity="0.18" transform="translate(1.6,1.8)"/>
    <rect x="-44" y="-15.5" width="88" height="33" rx="2.2" fill="url(#paper)" stroke="#b08a4a" stroke-width="1.15"/>
    <rect x="-39.2" y="-11" width="78.4" height="24" rx="1.2" fill="none" stroke="#c4a06a" stroke-width="0.7" stroke-dasharray="2.2 1.6"/>
    <g fill="none" stroke="#2a2418" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round">
      <!-- T -->
      <path d="M-33.2,-5.4 H-19.4"/>
      <path d="M-26.3,-5.4 V9.0"/>
      <!-- I -->
      <path d="M-15.4,-5.4 H-6.4"/>
      <path d="M-10.9,-5.4 V9.0"/>
      <path d="M-15.4,9.0 H-6.4"/>
      <!-- P -->
      <path d="M-1.8,-5.4 V9.0"/>
      <path d="M-1.8,-5.4 H5.2 C10.6,-5.4 10.8,2.8 5.2,2.8 H-1.8"/>
      <!-- S -->
      <path d="M21.6,-4.2 C20.2,-6.8 16.2,-7.6 13.4,-6.2 C10.2,-4.8 10.4,-1.0 13.8,0.4 C17.4,1.8 21.4,3.0 20.6,6.4 C19.6,10.0 15.2,10.8 11.8,9.0 C10.0,8.0 9.2,6.2 9.4,5.2"/>
    </g>
  </g>

  <!-- Outer outline, redrawn on top so the label tucks slightly under the glass edge -->
  <path d="M40.5,49
    C26,54 23,70 22.5,94
    C22,124 25,152 39,166.5
    C53,181 74,183 100,183
    C126,183 147,181 161,166.5
    C175,152 178,124 177.5,94
    C177,70 174,54 159.5,49
    Z" fill="none" stroke="#243022" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Soft inner edge so the silhouette holds up on a dark panel -->
  <path d="M40.5,49
    C26,54 23,70 22.5,94
    C22,124 25,152 39,166.5
    C53,181 74,183 100,183
    C126,183 147,181 161,166.5
    C175,152 178,124 177.5,94
    C177,70 174,54 159.5,49
    Z" fill="none" stroke="#edf3e6" stroke-width="1.1" stroke-linejoin="round" opacity="0.22"/>

  <!-- Mouth line under the lid -->
  <path d="M40.5,49 H159.5" fill="none" stroke="#243022" stroke-width="1.7" stroke-linecap="round"/>

  <!-- ===== LID ===== -->
  <ellipse cx="100" cy="25.5" rx="72" ry="13.8" fill="#6a3a16"/>
  <path d="M28,25.5 L28,43.5 A72 13.8 0 0 0 172,43.5 L172,25.5 A72 13.8 0 0 1 28,25.5 Z" fill="url(#lidSide)"/>
  <path d="M28.6,32 A72 13.8 0 0 0 171.4,32" fill="none" stroke="#8a4a1c" stroke-width="1.15" opacity="0.7"/>
  <path d="M28.6,37 A72 13.8 0 0 0 171.4,37" fill="none" stroke="#f0b07a" stroke-width="0.9" opacity="0.45"/>
  <ellipse cx="100" cy="43.5" rx="72" ry="13.8" fill="#8a4e20"/>
  <ellipse cx="100" cy="41" rx="72" ry="13.8" fill="#c07838"/>
  <ellipse cx="100" cy="41" rx="72" ry="13.8" fill="none" stroke="#5a3010" stroke-width="1.3"/>
  <ellipse cx="100" cy="25.5" rx="72" ry="13.8" fill="url(#lidTop)"/>
  <ellipse cx="100" cy="25.5" rx="72" ry="13.8" fill="none" stroke="#5a3010" stroke-width="1.55"/>
  <ellipse cx="100" cy="25.5" rx="63" ry="10.8" fill="none" stroke="#f3c08a" stroke-width="1.1" opacity="0.55"/>

  <!-- Coin slot -->
  <ellipse cx="100" cy="25.8" rx="23" ry="4.8" fill="#2a1608"/>
  <ellipse cx="100" cy="24.8" rx="20" ry="3.3" fill="#120a04"/>
  <ellipse cx="100" cy="24.0" rx="20" ry="3.3" fill="none" stroke="#6a3a16" stroke-width="0.7" opacity="0.8"/>

  <path d="M48,20.2 A58 11 0 0 1 94,16.2" fill="none" stroke="#fff1d0" stroke-width="2.2" stroke-linecap="round" opacity="0.48"/>

  <!-- X coin resting on the lid, Zcash coin slipping into the slot -->
  <use href="#coinX"   transform="translate(148,18.5) rotate(26) scale(0.62)"/>
  <use href="#coinZec" transform="translate(93,15.5) rotate(-22) scale(0.72)"/>
</svg>
